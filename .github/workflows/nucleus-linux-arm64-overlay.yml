name: Nucleus Linux arm64 SwiftPM overlay

on:
  push:
    branches:
      - codex/linux-swiftpm-overlay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nucleus-linux-arm64-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-24.04-arm
    env:
      SWIFT_ARCHIVE_URL: https://download.swift.org/swift-6.4.x-branch/ubuntu2404-aarch64/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-01-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-01-a-ubuntu24.04-aarch64.tar.gz
      SWIFT_ARCHIVE_SHA256: d0d2aa2a243bf33d038da02611055bf13e48fe0e20a41a8443faa731884a03de
      SWIFT_BUILD_REVISION: fda17c06401e1eedf2f040cbfff14aa992650dac
      OVERLAY_NAME: nucleus-swiftpm-overlay-linux-arm64

    steps:
      - name: Check out the exact SwiftPM revision
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/swift-package-manager"
          git -C "$RUNNER_TEMP/swift-package-manager" remote add origin \
            "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/swift-package-manager" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/swift-package-manager" checkout --detach FETCH_HEAD

      - name: Install the pinned Swift compiler
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/swift.tar.gz"
          root="$RUNNER_TEMP/swift"
          curl --fail --location --retry 3 --output "$archive" "$SWIFT_ARCHIVE_URL"
          printf '%s  %s\n' "$SWIFT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$root"
          tar --extract --gzip --file "$archive" --directory "$root" --strip-components=1
          printf '%s\n' "$root/usr/bin" >> "$GITHUB_PATH"
          "$root/usr/bin/swift" --version | grep --fixed-strings 'Swift version 6.4-dev'

      - name: Restore the SwiftBuild test workspace
        id: swift-build-test-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/swift-build-tests
          key: nucleus-swift-build-tests-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_BUILD_REVISION }}
          restore-keys: |
            nucleus-swift-build-tests-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify the SwiftBuild regression on Linux
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/swift-build"
          git init "$source"
          git -C "$source" remote add origin https://github.com/nucleus-os/swift-build.git
          git -C "$source" fetch --depth=1 origin "$SWIFT_BUILD_REVISION"
          git -C "$source" checkout --detach FETCH_HEAD
          swift test \
            --package-path "$source" \
            --scratch-path "$RUNNER_TEMP/swift-build-tests" \
            --build-system native \
            --filter HostBuildToolTaskConstructionTests.hostToolUsesHostSDKWhenDestinationIsAlsoLinux

      - name: Save the SwiftBuild test workspace
        if: always() && steps.swift-build-test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/swift-build-tests
          key: nucleus-swift-build-tests-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_BUILD_REVISION }}

      - name: Restore the SwiftPM release workspace
        id: swiftpm-release-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/swiftpm-build
          key: nucleus-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_BUILD_REVISION }}-${{ github.sha }}
          restore-keys: |
            nucleus-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_BUILD_REVISION }}-

      - name: Build the pinned SwiftPM and SwiftBuild overlay
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/swift-package-manager"
          scratch="$RUNNER_TEMP/swiftpm-build"
          swift build \
            --package-path "$source" \
            --scratch-path "$scratch" \
            --build-system native \
            --configuration release \
            --product swift-package-manager \
            --only-use-versions-from-resolved-file
          bin_path=$(swift build \
            --package-path "$source" \
            --scratch-path "$scratch" \
            --build-system native \
            --configuration release \
            --show-bin-path \
            --only-use-versions-from-resolved-file)
          test -x "$bin_path/swift-package-manager"
          printf '%s\n' "$bin_path" > "$RUNNER_TEMP/swiftpm-bin-path"

      - name: Save the SwiftPM release workspace
        if: always() && steps.swiftpm-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/swiftpm-build
          key: nucleus-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_BUILD_REVISION }}-${{ github.sha }}

      - name: Assemble and validate the overlay archive
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/swift-package-manager"
          bin_path=$(cat "$RUNNER_TEMP/swiftpm-bin-path")
          root="$RUNNER_TEMP/overlay"
          output="$RUNNER_TEMP/$OVERLAY_NAME.tar.gz"
          install -d "$root/usr/bin" "$root/usr/share/pm" "$root/usr/share/nucleus"
          install -m 0755 "$bin_path/swift-package-manager" "$root/usr/bin/swift-package"
          ln -s swift-package "$root/usr/bin/swift-build"
          find "$bin_path" -mindepth 1 -maxdepth 1 -type d \
            \( -name '*.bundle' -o -name '*.resources' \) \
            -exec cp -a {} "$root/usr/share/pm/" \;
          universal_platform_resources=$(find "$root/usr/share/pm" \
            -mindepth 1 -maxdepth 1 -type d \
            \( -name 'SwiftBuild_SWBUniversalPlatform.bundle' \
               -o -name 'SwiftBuild_SWBUniversalPlatform.resources' \) \
            -print -quit)
          test -n "$universal_platform_resources"
          test -f "$universal_platform_resources/ProductTypes.xcspec"
          grep --fixed-strings 'SDKROOT = "$(HOST_PLATFORM)";' \
            "$universal_platform_resources/ProductTypes.xcspec"
          printf '%s\n' \
            "swift-package-manager=$GITHUB_SHA" \
            "swift-build=$SWIFT_BUILD_REVISION" \
            "swift-compiler-archive-sha256=$SWIFT_ARCHIVE_SHA256" \
            > "$root/usr/share/nucleus/swiftpm-overlay-provenance.txt"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --create --gzip --file "$output" \
            --directory "$root" .
          archive_digest=$(sha256sum "$output" | cut -d ' ' -f1)
          printf '%s  %s\n' "$archive_digest" "$(basename "$output")" \
            > "$output.sha256"
          LD_LIBRARY_PATH="$RUNNER_TEMP/swift/usr/lib/swift/linux" \
            "$root/usr/bin/swift-build" --version

      - name: Publish the immutable overlay release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nucleus-swiftpm-overlay-$GITHUB_SHA"
          archive="$RUNNER_TEMP/$OVERLAY_NAME.tar.gz"
          gh release create "$tag" \
            "$archive" \
            "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nucleus SwiftPM overlay $GITHUB_SHA" \
            --notes "Linux arm64 SwiftPM overlay with SwiftBuild $SWIFT_BUILD_REVISION, built by the pinned Swift 6.4 compiler archive."
